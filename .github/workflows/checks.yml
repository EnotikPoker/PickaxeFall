name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 2
      - name: Validate source and asset metadata
        run: python3 Tools/CheckSourceContracts.py
      - name: Check Yandex platform adapter
        run: node Tools/TestYandexBridge.cjs
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
