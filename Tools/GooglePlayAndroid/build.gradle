apply plugin: 'com.android.library'
android {
    namespace 'com.enotikpoker.pickaxefall.platform'
    compileSdk 36
    buildToolsVersion "36.0.0"
    defaultConfig { minSdk 26; targetSdk 36; consumerProguardFiles 'consumer-rules.pro' }
    sourceSets { main { manifest.srcFile 'AndroidManifest.xml'; java.srcDirs = ['src']; res.srcDirs = ['res'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    compileOnly files(rootProject.file('unityLibrary/libs/unity-classes.jar'))
    implementation 'com.google.android.gms:play-services-games-v2:22.1.0'
    implementation 'com.yandex.android:mobileads:7.18.8'
    implementation 'net.kidoz.sdk:kidoz-android-native:10.1.9'
}
