<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>PickaxeFall</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 fill=%27%23203442%27/%3E%3Cpath d=%27M3 5L11 3L14 7M9 4L5 14%27 stroke=%27%23c8deaa%27 stroke-width=%272%27/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#162330;color:#fff;font:18px monospace}body{display:flex;justify-content:center;align-items:center;background:repeating-linear-gradient(45deg,#162330 0 24px,#1b2a36 24px 48px)}#game{position:relative;width:min(100vw,56.25dvh);height:100dvh;max-height:100%;touch-action:none}canvas{width:100%;height:100%;display:block;outline:none;touch-action:none}#loading{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:20px;background:#203442;padding:24px;text-align:center}progress{width:80%;height:18px;accent-color:#8bd180}button{background:#567448;border:3px solid #a8bf8f;color:white;padding:14px;font:inherit;cursor:pointer}#error{display:none}canvas,#game{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
</style>
<script>window.PICKAXEFALL_CONFIG={midRunAds:false};window.pickaxeSdk=new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='/sdk.js';s.onload=()=>YaGames.init().then(resolve,reject);s.onerror=reject;document.head.appendChild(s);});window.pickaxeSdk.catch(()=>{});</script>
<script src="platform.js"></script></head><body>
<div id="game"><canvas id="unity-canvas" tabindex="0"></canvas><div id="loading"><b>PickaxeFall</b><span id="caption">Loading…</span><progress id="progress" max="1" value="0"></progress><button id="error" onclick="location.reload()">Reload / Перезагрузить</button></div></div>
<script>
const canvas=document.getElementById('unity-canvas'),loading=document.getElementById('loading');
window.pickaxeSdk.then(sdk=>{const lang=sdk.environment.i18n.lang;document.documentElement.lang=lang==='ru'?'ru':'en';document.getElementById('caption').textContent=lang==='ru'?'Загрузка…':'Loading…';}).catch(()=>{});
canvas.addEventListener('pointerdown',()=>{if(instance&&matchMedia('(pointer:coarse)').matches&&!document.fullscreenElement&&document.fullscreenEnabled)instance.SetFullscreen(1);});
canvas.addEventListener('contextmenu',e=>e.preventDefault());canvas.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
let instance;const build='Build/';const loader=document.createElement('script');loader.src=build+'{{{ LOADER_FILENAME }}}';
const fail=()=>{document.getElementById('caption').textContent='Could not load. Reload to try again. / Не удалось загрузить игру. Попробуй ещё раз.';document.getElementById('error').style.display='block';};
loader.onload=()=>createUnityInstance(canvas,{dataUrl:build+'{{{ DATA_FILENAME }}}',frameworkUrl:build+'{{{ FRAMEWORK_FILENAME }}}',codeUrl:build+'{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:'EnotikPoker',productName:'PickaxeFall',productVersion:'{{{ PRODUCT_VERSION }}}',autoSyncPersistentDataPath:true,devicePixelRatio:Math.min(window.devicePixelRatio||1,1.5)},p=>document.getElementById('progress').value=p).then(game=>{instance=game;window.pickaxeInstance=game;loading.remove();canvas.focus();}).catch(fail);
loader.onerror=fail;document.body.appendChild(loader);
</script></body></html>
